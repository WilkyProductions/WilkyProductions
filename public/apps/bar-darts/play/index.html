<style>
#bds{position:fixed;inset:0;z-index:99999;background:#111814 url(splash.png) center/contain no-repeat;transition:opacity .45s ease;pointer-events:none}
#bds.out{opacity:0}
#bdsc{position:absolute;left:0;top:0;width:0;height:0}
#bdsd{position:absolute;left:0;top:0;transform-origin:0 0;opacity:0}
#bdsd svg{position:absolute;left:-22px;top:-60px;overflow:visible}
#bdsq{transform-origin:0 0}
#bdsd.go{animation:bdsfly .48s cubic-bezier(.55,0,.9,.55) forwards}
#bdsq.hit{animation:bdsquiver .5s ease-out}
@keyframes bdsfly{0%{opacity:0;transform:translate(1500px,870px) rotate(30deg) scale(3.4)}12%{opacity:1}100%{opacity:1;transform:translate(0,0) rotate(30deg) scale(1.16)}}
@keyframes bdsquiver{0%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(1deg)}100%{transform:rotate(0)}}
#bdsr{position:absolute;left:0;top:0;width:100px;height:100px;margin:-50px 0 0 -50px;border-radius:50%;border:16px solid #FF8A3D;opacity:0;box-sizing:border-box}
#bdsr.go{animation:bdsring .6s ease-out forwards}
@keyframes bdsring{0%{opacity:.95;transform:scale(.4)}100%{opacity:0;transform:scale(7)}}
</style>
<script>
(function(){
  var el=document.getElementById('bds'),c=document.getElementById('bdsc'),d=document.getElementById('bdsd'),q=document.getElementById('bdsq'),r=document.getElementById('bdsr'),started=false;
  function plug(n){try{return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins[n]}catch(e){return null}}
  function hideNative(){var S=plug('SplashScreen');try{if(S)S.hide({fadeOutDuration:0})}catch(e){}}
  function place(){var W=window.innerWidth,H=window.innerHeight,s=Math.min(W/1260,H/2049);c.style.transform='translate('+(W/2)+'px,'+(H/2-35.5*s)+'px) scale('+s+')'}
  function done(){el.classList.add('out');setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},500)}
  function start(){if(started)return;started=true;place();hideNative();
    setTimeout(function(){d.classList.add('go')},250);
    setTimeout(function(){r.classList.add('go');q.classList.add('hit');var H=plug('Haptics');try{if(H)H.impact({style:'MEDIUM'})}catch(e){}},730);
    setTimeout(done,1750)}
  window.addEventListener('resize',place);
  var img=new Image();img.onload=start;img.onerror=start;img.src='splash.png';
  setTimeout(start,1200);setTimeout(function(){hideNative();if(el.parentNode)done()},4000);
})();
</script>
<style>
/* Layout: pub-scoreboard. Big tappable board on the left, chalk scoreboard + feed on the right; stacks on phones. Single dark theme by choice. */
:root{
  --bg:#111814; --panel:#19221e; --panel-2:#202b26; --line:#2d3b35;
  --chalk:#ece6d6; --muted:#8e9a92;
  --t0:#ff8a3d; --t1:#3fb4e6; --t2:#c08cff;
  --t0-ink:#2a1606; --t1-ink:#06202b; --t2-ink:#1f0d38;
  --seg-dark:#1d2420; --seg-light:#3d3a31; --ring-red:#5b2924; --ring-green:#1f3e2c; --wire:#0b0f0d;
  --font-display:"Teko","Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --font-body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--chalk);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:8px;min-height:100%}

/* header */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tbbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border:2px solid var(--chalk);border-radius:14px;padding:10px 16px;background:var(--panel)}
.tbtarget{text-align:center;min-width:110px}
.tbtarget .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tbtarget .v{font-family:var(--font-display);font-size:64px;line-height:.85;font-weight:700}
.tbinfo{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
.tbside{display:inline-flex;gap:6px;align-items:baseline;font-family:var(--font-display);font-size:24px;text-transform:uppercase;color:var(--tc);margin-right:16px}
.tbside .ok{color:#8fe07a;font-size:18px}.tbside .no{color:#ff8f8f;font-size:18px}
.tbmsg{color:var(--chalk)}
.tbmeta{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
#board .seg.tbt{stroke:var(--chalk);stroke-width:3;animation:tbpulse 1.2s ease-in-out infinite}
@keyframes tbpulse{50%{filter:brightness(1.8)}}
@media (prefers-reduced-motion:reduce){#board .seg.tbt{animation:none;filter:brightness(1.5)}}
.timer{font-family:var(--font-display);font-size:18px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;font-variant-numeric:tabular-nums;line-height:1}
.timer b{color:var(--chalk);font-weight:600}
.titleblock{display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--font-display);font-weight:700;font-size:clamp(52px,7vw,80px);line-height:.8;letter-spacing:.02em;text-transform:uppercase;margin:0;display:flex;align-items:baseline;gap:8px}
.brand span{color:var(--t0)} .brand em{font-style:normal;color:var(--t1)} .brand i{font-style:normal;color:var(--t2)}
.round{font-family:var(--font-display);font-size:24px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;line-height:1}
.round b{color:var(--chalk);font-weight:600}
.top .spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--panel-2)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--chalk);color:var(--bg);border-color:var(--chalk)}
.btn.big{padding:14px 22px;font-size:17px;border-radius:10px}

/* game layout */
.game{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:900px){.game{grid-template-columns:minmax(0,1fr) 320px;align-items:start}}
.boardcol{display:flex;flex-direction:column;gap:8px;min-width:0;container-type:inline-size}
.boardrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"th bd od";align-items:end;gap:12px}
.boardbox{grid-area:bd;position:relative;width:min(calc(100vh - 165px),calc(100dvh - 165px),78cqw);min-width:240px;aspect-ratio:1}
@container (max-width:620px){
  .boardrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"th od" "bd bd"}
  .boardbox{width:min(100cqw,calc(100dvh - 240px));justify-self:center}
}
.brand{font-size:clamp(38px,4vw,54px)!important}
.round{font-size:20px!important}
#board{width:100%;height:100%;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#board .seg{stroke:var(--wire);stroke-width:1.2;cursor:pointer;transition:filter .12s}
#board .seg:hover{filter:brightness(1.45)}
#board.locked .seg{cursor:default}
#board.locked .seg:hover{filter:none}
#board .ov{pointer-events:none;transition:fill-opacity .25s,fill .25s}
#board .flash{animation:flash .45s ease-out}
@keyframes flash{0%{filter:brightness(3)}100%{filter:brightness(1)}}
.badge circle{transition:fill .25s,stroke .25s}
.badge{pointer-events:none}
#missring{cursor:pointer;transition:fill .15s}
#board:not(.locked) #missring:hover{fill:var(--panel-2)}
#board.locked #missring{cursor:default}
#missring.flashmiss{animation:flashmiss .4s ease-out}
@keyframes flashmiss{0%{fill:#4a4f4b}100%{fill:var(--panel)}}
.badge text{font-family:var(--font-display);font-weight:600;font-size:19px;text-anchor:middle;dominant-baseline:central;pointer-events:none}

.pending{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(3px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pending-card{display:flex;flex-direction:column;gap:14px;padding:22px;width:100%;max-width:480px;max-height:100%;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--tc);border-radius:16px;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.pending-card .headline{font-family:var(--font-display);font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:4px 12px;font-weight:600;font-size:13.5px;border:1px solid var(--line);background:var(--panel-2)}
.chip.lock{background:var(--tc);color:var(--tink);border-color:var(--tc)}
.chip.steal,.chip.break{border-color:var(--tc);color:var(--tc)}
.recaplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.turngain{flex:none;text-align:center;border-radius:12px;padding:8px 14px;background:var(--bg);border:1px solid var(--line);min-width:96px}
.turngain .v{font-family:var(--font-display);font-size:52px;line-height:.85;font-weight:600;font-variant-numeric:tabular-nums}
.turngain .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:4px}
.turngain.pos .v{color:#8fe07a}.turngain.neg .v{color:#ff8f8f}.turngain.zero .v{color:var(--muted)}
.turnhead{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.recaplist .dd{font-family:var(--font-display);font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
.recaplist .dd.pos{color:#8fe07a}.recaplist .dd.neg{color:#ff8f8f}.recaplist .dd.zero{color:var(--line)}
.recaplist li{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--bg)}
.recaplist .lbl{font-family:var(--font-display);font-size:24px;line-height:1}
.recaplist .txt{color:var(--muted)}
.recaplist li.hot .txt{color:var(--chalk);font-weight:600}
.nextrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.minis{display:flex;gap:12px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);flex-wrap:wrap}
.minis b{font-family:var(--font-display);font-size:22px;font-weight:600;margin-right:3px}
#board .mk{pointer-events:none}
#board .mk *{fill:none;stroke-linecap:round;transition:opacity .2s}
#board .mk .h{stroke:var(--wire);stroke-width:9}
#board .mk .c{stroke-width:4.5}
.pending-card .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pending-card .who{font-family:var(--font-display);font-size:34px;line-height:.9;text-transform:uppercase}
.pending-card .recap{color:var(--muted);font-size:14px}

.dartbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.thrower{grid-area:th;min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:left}
.thrower .tname{font-family:var(--font-display);font-weight:600;font-size:clamp(28px,4.6vw,56px);line-height:.9;text-transform:uppercase;letter-spacing:.02em;color:var(--tc);display:block;overflow-wrap:normal;word-break:normal}
.ondeck{grid-area:od;min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:right}
.ondeck .dname{font-family:var(--font-display);font-weight:600;font-size:clamp(22px,3.2vw,38px);line-height:.9;text-transform:uppercase;letter-spacing:.02em;color:var(--tc);display:block;overflow-wrap:normal;word-break:normal}
.ondeck .lbl,.ondeck .tm{font-family:var(--font-display);font-size:clamp(15px,2vw,20px);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1}
.thrower .dartn{white-space:nowrap;font-family:var(--font-display);font-size:clamp(13px,1.6vw,22px);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.thrower .dot{width:12px;height:12px;border-radius:50%}
.slots{display:flex;gap:6px}
.slot{min-width:64px;height:40px;border-radius:8px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:22px;color:var(--muted);padding:0 8px}
.slot.filled{border-style:solid;color:var(--chalk);background:var(--panel)}
.missbtn{font-family:var(--font-display);font-size:22px;letter-spacing:.06em;text-transform:uppercase;padding:6px 20px}
.offbtn{border-color:#7a2f2f;color:#ff8f8f}
.offbtn:hover{background:#3a1c1c}
.offtoast{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:16px}
.offtoast .inner{text-align:center;transform:rotate(-4deg);animation:offpop 1.9s ease-out forwards}
.offtoast .big{font-family:var(--font-display);font-weight:700;font-size:clamp(64px,12vw,150px);line-height:.8;text-transform:uppercase;color:#ff5a5f;text-shadow:0 4px 0 #3a0d0f,0 0 40px rgba(255,90,95,.45)}
.offtoast .quip{font-family:var(--font-display);font-size:clamp(24px,3.5vw,40px);color:var(--chalk);margin-top:10px;text-transform:uppercase;letter-spacing:.03em}
.offtoast .pen{display:inline-block;margin-top:10px;font-family:var(--font-display);font-size:30px;background:#ff5a5f;color:#2e0709;border-radius:999px;padding:2px 16px}
@keyframes offpop{0%{transform:rotate(-4deg) scale(2.4);opacity:0}12%{transform:rotate(-4deg) scale(.95);opacity:1}18%{transform:rotate(-4deg) scale(1.03)}80%{opacity:1}100%{transform:rotate(-4deg) scale(1);opacity:0}}
.boardbox.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-10px,3px) rotate(-1deg)}40%{transform:translate(9px,-4px) rotate(1deg)}60%{transform:translate(-6px,2px)}80%{transform:translate(4px,-1px)}}
.offtoast.bonus .big{color:var(--tc);text-shadow:0 4px 0 rgba(0,0,0,.55),0 0 44px var(--tc)}
.offtoast.bonus .inner{transform:rotate(-3deg)}
.chip.off{border-color:#ff5a5f;color:#ff8f8f}
.shame{font-size:14px;color:var(--muted)}
.shame b{color:#ff8f8f;font-weight:600}
@media (prefers-reduced-motion:reduce){.offtoast .inner{animation:offfade 1.9s forwards}.boardbox.shake{animation:none}}
@keyframes offfade{0%,80%{opacity:1}100%{opacity:0}}

/* side */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.teams{display:flex;flex-direction:column;gap:6px}
.team{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px 8px 0;position:relative;overflow:hidden}
.team::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--tc)}
.team.active{border-color:var(--tc);box-shadow:0 0 0 1px var(--tc) inset;background:color-mix(in srgb,var(--tc) 10%,var(--panel))}
.team .rank{font-family:var(--font-display);font-size:26px;line-height:1;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.team.first .rank{color:var(--chalk)}
.team .mid{min-width:0;display:flex;flex-direction:column;gap:2px}
.team .name{font-family:var(--font-display);font-size:24px;line-height:.95;text-transform:uppercase;letter-spacing:.03em;color:var(--tc);overflow-wrap:anywhere}
.team .stats{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.3}
.team .players{font-size:13px;display:flex;flex-wrap:wrap;gap:2px 10px;color:var(--muted)}
.team .players span{display:inline-flex;align-items:center;gap:5px}
.team .players span.up{color:var(--chalk);font-weight:700}
.team .players span.up::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tc)}
.team .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.team .score{font-family:var(--font-display);font-size:46px;line-height:.85;font-weight:600;font-variant-numeric:tabular-nums}
.team .gap{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.team.first .gap{color:var(--tc);font-weight:600}
.left{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--chalk);margin-left:2px;font-variant-numeric:tabular-nums}
.left.done{color:var(--muted);border-style:dashed;text-decoration:line-through}
.team .players span.isdone{opacity:.6}
.team.done{opacity:.62}
.team .right .left{margin-top:4px}

function newGame(cfg){const P=cfg.perTeam||cfg.teams[0].players.length;const teams=cfg.teams.slice(0,cfg.numTeams||cfg.teams.length).map(t=>P===1?{name:t.solo||t.name,color:t.color,players:[t.solo||t.players[0]]}:{name:t.name,color:t.color,players:t.players.slice(0,2)});
  return{phase:'play',teams,rounds:cfg.rounds,penalty:cfg.penalty==null?0.5:cfg.penalty,penV2:1,startedAt:Date.now(),roundStartedAt:Date.now(),roundTimes:[],off:teams.map(()=>0),shame:{},round:1,turnIdx:0,darts:[],pending:false,lastTurn:null,terr:freshTerr(),feed:[]}}
function save(){try{localStorage.setItem(STORE,JSON.stringify({S,history:history.slice(-40),setupDraft}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(STORE)||'null');if(d){if(d.setupDraft)setupDraft=d.setupDraft;normDraft();if(d.S&&d.S.phase!=='setup'){S=d.S;history=d.history||[]}}}catch(e){}}
function snap(){history.push(JSON.stringify(S))}

const NT=()=>S.teams.length;const PP=()=>S.teams[0].players.length;const TPR=()=>NT()*PP();
function current(){const N=NT();const team=S.turnIdx%N;const p=Math.floor(S.turnIdx/N);return{team,player:p,name:S.teams[team].players[p]}}
function nextUp(){const N=NT();let t=S.turnIdx+1,r=S.round;if(t===TPR()){t=0;r++}if(r>S.rounds)return null;const team=t%N;return{team,name:S.teams[team].players[Math.floor(t/N)]}}
function numName(n){return n===25?'Bull':String(n)}
function hitPop(n,m,col){const bb=document.getElementById('boardbox');if(!bb||n<0)return;
  const t=n===0?'MISS':n===25?(m===2?'BULL':'25'):(['','S','D','T'][m])+n;
  const old=bb.querySelector('.hitpop');if(old)old.remove();
  const el=document.createElement('div');el.className='hitpop';el.setAttribute('aria-hidden','true');
  el.innerHTML=`<span style="--c:${n===0?'var(--muted)':col}">${t}</span>`;bb.appendChild(el);setTimeout(()=>el.remove(),650)}
function hitLabel(n,m){if(n===25)return m===2?'BULL':'OB';return(['','S','D','T'][m])+n}

function applyHit(team,n,mult){
  const t=S.terr[n];const m=mult;const other=t.owner===null?'':S.teams[t.owner].name;const nn=numName(n);
  const mk=(text,kind)=>({text,kind,nn});const mw=s=>s===1?'1 mark':s+' marks';
  if(t.owner===null){t.owner=team;t.s=Math.min(3,m);return t.s===3?mk(`locked ${nn}`,'lock'):mk(`claimed ${nn} (${mw(t.s)})`,'claim')}
  if(t.owner===team){if(t.s===3)return mk(`${nn} already locked`,'none');t.s=Math.min(3,t.s+m);return t.s===3?mk(`locked ${nn}`,'lock'):mk(`built ${nn} up to ${mw(t.s)}`,'reinforce')}
  if(t.s===3){const breaks=(n!==25&&mult===3)||(n===25&&mult===2);if(breaks){t.owner=null;t.s=0;return mk(`broke ${other}'s lock on ${nn}`,'break')}return mk(`${nn} is locked, no effect`,'none')}
  const rem=t.s-m;
  if(rem>0){t.s=rem;return mk(`knocked ${other} down to ${mw(rem)} on ${nn}`,'weaken')}
  if(rem===0){t.owner=null;t.s=0;return mk(`knocked ${nn} back to neutral`,'neutral')}
  t.owner=team;t.s=Math.min(3,-rem);return mk(`stole ${nn} from ${other} (${mw(t.s)})`,'steal');
}

function tally(team){
  let held=0,locks=0,pts=0,bull=0,heldPts=0,lockPts=0;
  for(const n of [...ORDER,25]){const t=S.terr[n];if(t.owner!==team)continue;const v=(t.s===3?2:1)*(n===25?2:1);pts+=v;held++;if(t.s===3)locks++;if(n===25)bull=v;else if(t.s===3)lockPts+=2;else heldPts+=1}
  // chains of 3+ neighbors around the board
  const own=ORDER.map(n=>S.terr[n].owner===team);let chain=0,chains=[];
  if(own.every(Boolean)){chain=20;chains=[20]}else{
    const start=own.indexOf(false);let run=0;
    for(let k=1;k<=20;k++){const i=(start+k)%20;if(own[i])run++;else{if(run>=3){chain+=run;chains.push(run)}run=0}}
  }
  const off=(S.off&&S.off[team])||0,pen=off*(S.penalty==null?0.5:S.penalty);
  const base=pts;return{held,locks,base,chain,chains,bull,heldPts,lockPts,off,pen,total:base+chain-pen};
}

function throwDart(n,mult){buzz(n);
  if(!S||S.phase!=='play'||S.pending)return;
  snap();const c=current();setTimeout(()=>hitPop(n,mult,`var(--t${c.team})`),0);const before=S.teams.map((_,i)=>tally(i).total);
  let r,label;
  let offboard=false;
  if(n===-1){offboard=true;const pen=S.penalty==null?0.5:S.penalty;S.off=S.off||S.teams.map(()=>0);S.off[c.team]=(S.off[c.team]||0)+1;S.shame=S.shame||{};S.shame[c.name]=(S.shame[c.name]||0)+1;
    r={text:pen?`off the board, −${pen} point${pen!==1?'s':''}`:'off the board',kind:'off'};label='OFF'}
  else if(n===0){r={text:'missed',kind:'miss'};label='Miss'}else{r=applyHit(c.team,n,mult);label=hitLabel(n,mult)}
  const text=r.text;S.turn=S.turn||[];S.turn.push({label,text,kind:r.kind,nn:r.nn});
  S.darts.push(label);
  const after=S.teams.map((_,i)=>tally(i).total);const dl=after.map((v,i)=>+(v-before[i]).toFixed(2));
  {const tl=S.turn[S.turn.length-1];tl.d=dl[c.team];tl.opp=dl.map((v,i)=>[i,v]).filter(([i,v])=>i!==c.team&&v!==0)}
  S.feed.unshift({team:c.team,who:c.name,label,text,kind:r.kind,r:S.round,d:dl[c.team],opp:dl.map((v,i)=>[i,v]).filter(([i,v])=>i!==c.team&&v!==0)});
  if(S.darts.length===3){S.pending=true;S.lastTurn={team:c.team,who:c.name,darts:S.darts.slice(),turn:S.turn.slice()};if(!nextUp()){S.phase='over';S.endedAt=Date.now()}}
  save();render();
  if(offboard)showOff(c.name);
  if(n>0){const el=document.querySelector(`[data-n="${n}"][data-m="${mult}"]`);if(el){el.classList.remove('flash');void el.getBBox();el.classList.add('flash')}}
}
const QUIPS=['The wall felt that one','Somebody check the drywall','That dart is in another zip code','Board is over here, champ','Sponsored by spackle','Bold strategy','The cat is not safe','Physics has left the chat','Was that a warning shot?','Wrong game, wrong wall','Have you tried aiming?','Somewhere a dartboard weeps'];
let offTimer=null;
function showOff(name){const pen=S.penalty==null?0.5:S.penalty;let el=$('#offtoast');if(el)el.remove();
  el=document.createElement('div');el.id='offtoast';el.className='offtoast';el.setAttribute('role','status');
  el.innerHTML=`<div class="inner"><div class="big">Off the board!</div><div class="quip">${esc(QUIPS[Math.floor(Math.random()*QUIPS.length)])}</div>${pen?`<div class="pen">−${pen} ${esc(name)}</div>`:''}</div>`;
  document.body.appendChild(el);const bb=$('#boardbox');if(bb){bb.classList.remove('shake');void bb.offsetWidth;bb.classList.add('shake')}
  clearTimeout(offTimer);offTimer=setTimeout(()=>{el.remove()},1950)}
function advance(){snap();S.pending=false;S.darts=[];S.turn=[];S.turnIdx++;if(S.turnIdx===TPR()){S.turnIdx=0;S.round++;S.roundTimes=S.roundTimes||[];S.roundTimes.push(Date.now()-(S.roundStartedAt||Date.now()));S.roundStartedAt=Date.now()}save();render()}
function undo(){if(!history.length)return;S=JSON.parse(history.pop());ui.confirm=false;save();render()}

/* ---------- board svg ---------- */
function pt(r,a){const t=a*Math.PI/180;return[(r*Math.cos(t)).toFixed(2),(r*Math.sin(t)).toFixed(2)]}
function wedge(r1,r2,a1,a2){const[a,b]=pt(r2,a1),[c,d]=pt(r2,a2),[e,f]=pt(r1,a2),[g,h]=pt(r1,a1);return`M${a} ${b}A${r2} ${r2} 0 0 1 ${c} ${d}L${e} ${f}A${r1} ${r1} 0 0 0 ${g} ${h}Z`}
function markG(n,x,y,sc){const parts=['<path class="X1" d="M-8 8L8 -8"/>','<path class="X2" d="M-8 -8L8 8"/>','<circle class="X3" r="14"/>'];
  return`<g class="mk" id="mk-${n}" transform="translate(${x} ${y}) scale(${sc})">${parts.map(p=>p.replace('class="','class="h ')).join('')}${parts.map(p=>p.replace('class="','class="c ')).join('')}</g>`}
function boardSVG(){
  let s='',ov='',bd='';
  ORDER.forEach((n,i)=>{
    const c=-90+i*18,a1=c-9,a2=c+9;const even=i%2===0;
    const single=even?'var(--seg-dark)':'var(--seg-light)',ring=even?'var(--ring-red)':'var(--ring-green)';
    s+=`<path class="seg" data-n="${n}" data-m="1" fill="${single}" d="${wedge(R.obull,R.tin,a1,a2)}"/>`;
    s+=`<path class="seg" data-n="${n}" data-m="3" fill="${ring}" d="${wedge(R.tin,R.tout,a1,a2)}"/>`;
    s+=`<path class="seg" data-n="${n}" data-m="1" fill="${single}" d="${wedge(R.tout,R.din,a1,a2)}"/>`;
    s+=`<path class="seg" data-n="${n}" data-m="2" fill="${ring}" d="${wedge(R.din,R.dout,a1,a2)}"/>`;
    ov+=`<path class="ov" id="ov-${n}" fill="transparent" fill-opacity="0" d="${wedge(R.obull,R.dout,a1,a2)}"/>`;
    const[x,y]=pt(R.label,c);
    const[mx,my]=pt(133,c);bd+=markG(n,mx,my,1);
    bd+=`<g class="badge" id="bd-${n}" transform="translate(${x} ${y})"><circle r="15" fill="transparent" stroke="transparent" stroke-width="2.5"/><text y="1" fill="var(--chalk)">${n}</text></g>`;
  });
  s+=`<circle class="seg" data-n="25" data-m="1" r="${R.obull}" fill="var(--ring-green)"/>`;
  s+=`<circle class="seg" data-n="25" data-m="2" r="${R.bull}" fill="var(--ring-red)"/>`;
  ov+=`<circle class="ov" id="ov-25" r="${R.obull}" fill="transparent" fill-opacity="0"/>`;
  ov+=markG(25,0,0,.62);
  ov+=`<circle id="bull-ring" r="${R.obull+3}" fill="none" stroke="transparent" stroke-width="3" pointer-events="none"/>`;
  return`<svg id="board" viewBox="-222 -222 444 444" role="img" aria-label="Dartboard. Tap where the dart landed.">
    <circle id="missring" r="218" fill="var(--panel)" stroke="var(--line)"><title>Tap here for a miss</title></circle>
    <circle r="${R.dout+1}" fill="var(--wire)"/>${s}<g>${ov}</g>${bd}</svg>`;
}
function paintBoard(){
  const svg=$('#board');if(!svg)return;
  svg.classList.toggle('locked',!(S.phase==='tb'||(S.phase==='play'&&!S.pending)));
  svg.querySelectorAll('.seg').forEach(e=>e.classList.toggle('tbt',S.phase==='tb'&&+e.dataset.n===S.tb.target));
  for(const n of [...ORDER,25]){
    const t=S.terr[n],o=$('#ov-'+n);
    o.style.fill=t.owner===null?'transparent':`var(--t${t.owner})`;o.setAttribute('fill-opacity',OPAC[t.s]);
    const mg=$('#mk-'+n);[1,2,3].forEach(k=>mg.querySelectorAll('.X'+k).forEach(e=>e.style.opacity=t.s>=k?1:0));
    mg.querySelectorAll('.c').forEach(e=>e.style.stroke=t.owner===null?'transparent':`var(--t${t.owner})`);
    if(n===25){const ring=$('#bull-ring');ring.style.stroke=t.s===3?`var(--t${t.owner})`:'transparent';continue}
    const g=$('#bd-'+n),ci=g.querySelector('circle'),tx=g.querySelector('text');
    if(t.owner===null){ci.style.fill='transparent';ci.style.stroke='transparent';tx.style.fill='var(--chalk)'}
    else{const col=`var(--t${t.owner})`;ci.style.stroke=col;
      ci.style.fill=t.s===3?col:t.s===2?`color-mix(in srgb, ${col} 30%, transparent)`:'transparent';
      tx.style.fill=t.s===3?`var(--t${t.owner}-ink)`:col}
  }
}

/* ---------- views ---------- */
function render(){
  const app=$('#app');
  if(appMode==='menu'){applyColors(DEF_TEAMS);app.innerHTML=menuView();window.scrollTo(0,0);return}
  if(appMode==='classic'){renderClassic();return}
  applyColors(S?S.teams:setupDraft.teams);
  if(!S){app.innerHTML=setupView();bindSetup();return}
  const keepBoard=$('#board')&&$('.game:not(.cgame)');
  if(!keepBoard){app.innerHTML=gameShell();$('#boardbox').insertAdjacentHTML('afterbegin',boardSVG());bindGame()}
  fillGame();paintBoard();
}

function setupView(){
  const d=setupDraft,P=d.perTeam,N=d.numTeams;
  const mins=estMin(d.rounds*N*P);
  const tf=(i)=>`<div class="teamform" style="--tc:var(--t${i})">
    ${P===1?`<label for="tn${i}">Player ${i+1}</label><input class="tname" id="tn${i}" maxlength="14" value="${esc(d.teams[i].solo)}">`
    :`<label for="tn${i}">Team ${i+1}</label><input class="tname" id="tn${i}" maxlength="16" value="${esc(d.teams[i].name)}">`}
    <div class="swatches" role="group" aria-label="Team ${i+1} color">${Object.entries(COLORS).map(([k,v])=>{const taken=d.teams.slice(0,d.numTeams).some((t,j)=>j!==i&&t.color===k);return`<button type="button" class="sw" data-team="${i}" data-color="${k}" style="--c:${v.c}" aria-label="${v.label}" title="${v.label}${taken?' (taken)':''}" aria-pressed="${d.teams[i].color===k}" ${taken?'disabled':''}></button>`}).join('')}</div>
    ${P===1?'':`<div class="pair"><div><label for="p${i}a">Thrower 1</label><input id="p${i}a" maxlength="14" value="${esc(d.teams[i].players[0])}"></div>
    <div><label for="p${i}b">Thrower 2</label><input id="p${i}b" maxlength="14" value="${esc(d.teams[i].players[1])}"></div></div>`}</div>`;
  return`<div class="setup">
    <div class="form">
      <button type="button" class="btn" data-act="g-menu" style="align-self:flex-start">← All games</button>
      <div class="hero"><h1><span>Turf</span> <em>War</em></h1><p>A darts game for 2 to 10 players: solo for up to 8, or teams of two for up to 10. Claim numbers, defend them, steal everyone else's, and build chains of neighbors around the board.</p></div>
      ${gamePicker('turf')}
      <div><span class="fieldlabel">Format</span><div class="seg-ctl" id="fmt">${[[1,'Solo'],[2,'Pairs']].map(([k,l])=>`<button type="button" data-k="${k}" aria-pressed="${k===P}">${l}</button>`).join('')}</div></div>
      <div><span class="fieldlabel">${P===1?'Players':'Teams'}</span><div class="seg-ctl" id="nteams">${(P===1?[2,3,4,5,6,7,8]:[2,3,4,5]).map(k=>`<button type="button" data-k="${k}" aria-pressed="${k===N}">${P===1?(k===2?'1 vs 1':k):(k===2?'2 vs 2':k+' teams')}</button>`).join('')}</div></div>
      <div class="shufflebar">${P===2?'<button type="button" class="btn" id="shuf-teams">Random teams</button>':''}<button type="button" class="btn" id="shuf-order">Random order</button></div>
      ${[...Array(N).keys()].map(tf).join('')}
      <div class="order"><span class="fieldlabel" style="margin:0 6px 0 0">Throwing order</span>${throwOrder(d).map((x,k)=>`${k?'<span>→</span>':''}<b style="color:var(--t${x.t})">${esc(x.n)}</b>`).join('')}</div>
      <div><span class="fieldlabel">Rounds</span><div class="seg-ctl" id="rounds">${[6,8,10,12].map(r=>`<button type="button" data-r="${r}" aria-pressed="${r===d.rounds}">${r}</button>`).join('')}</div>
      <div style="font-size:13px;color:var(--muted);margin-top:6px">Each round, every player throws 3 darts. ${d.rounds} rounds with ${N*P} players runs about ${mins} minutes.</div></div>
      <div><span class="fieldlabel">Off-the-board penalty</span><div class="seg-ctl" id="pen">${[[0,'None'],[0.5,'−0.5 point'],[1,'−1 point']].map(([k,l])=>`<button type="button" data-k="${k}" aria-pressed="${k===d.penalty}">${l}</button>`).join('')}</div>
      <div style="font-size:13px;color:var(--muted);margin-top:6px">Tap Off board when a dart misses the whole board. Tap Miss for darts that land on the board but outside the scoring rings.</div></div>
      <button class="btn primary big" id="start">Start game</button>
    </div>
    <div class="card rules"><h2>How to play</h2><ol>${rulesHTML()}</ol></div>
  </div>`;
}
function throwOrder(d){const N=d.numTeams,out=[];
  if(d.perTeam===1){for(let i=0;i<N;i++)out.push({t:i,n:d.teams[i].solo});return out}
  for(let k=0;k<2;k++)for(let i=0;i<N;i++)out.push({t:i,n:d.teams[i].players[k]});return out}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rulesHTML(){return`
  <li><b>Hit a number to claim it.</b> A single adds 1 mark, a double 2, a triple 3. Outer bull is 1, bullseye is 2.</li>
  <li><b>Marks are strength.</b> 1 mark is shaky, 2 is held, 3 is <b>locked</b>.</li>
  <li><b>Hit the other team's number</b> to knock marks off. Knock it past zero and it flips to you with the leftover marks.</li>
  <li><b>Locks only break to a triple</b> (a bullseye on the Bull). The number goes back to neutral.</li>
  <li><b>Scoring:</b> each number you hold is 1 point, locked is 2. The Bull counts double.</li>
  <li><b>Chain bonus:</b> 3 or more neighboring numbers around the board, like <span class="k">20 · 1 · 18</span>, earn +1 for every number in the chain.</li>
  <li><b>Throw order:</b> everyone throws in the same order each round. In pairs, each team's first player throws, then each team's second player.</li>
  <li><b>Off the board:</b> a dart that misses the whole board costs your side points (−0.5 by default, set on the setup screen or in Settings).</li>
  <li><b>Ties:</b> if the top spots finish level on points, play a tiebreaker. The app picks a number and each tied side throws one dart in turn. Hitting it wins, unless the next thrower also hits it to cancel, then go again.</li>
  <li><b>More than two sides:</b> stealing works the same against any opponent. A broken lock goes back to neutral for anyone to grab.</li>`}
function bindSetup(){
  const st=$('#shuf-teams');if(st)st.addEventListener('click',()=>{readSetup();const d=setupDraft,N=d.numTeams;
    const names=shuffle(d.teams.slice(0,N).flatMap(t=>t.players.slice(0,2)));
    for(let i=0;i<N;i++)d.teams[i].players=[names[2*i],names[2*i+1]];render()});
  $('#shuf-order').addEventListener('click',()=>{readSetup();const d=setupDraft,N=d.numTeams;
    const part=shuffle(d.teams.slice(0,N));if(d.perTeam===2)part.forEach(t=>{if(Math.random()<.5)t.players=[t.players[1],t.players[0]]});
    d.teams.splice(0,N,...part);render()});
  $('#pen').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;readSetup();setupDraft.penalty=+b.dataset.k;render()});
  $('#fmt').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;readSetup();setupDraft.perTeam=+b.dataset.k;if(setupDraft.perTeam===2&&setupDraft.numTeams>5)setupDraft.numTeams=5;render()});
  $('#nteams').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;readSetup();setupDraft.numTeams=+b.dataset.k;render()});
  document.querySelectorAll('.swatches').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('.sw');if(!b||b.disabled)return;readSetup();setupDraft.teams[+b.dataset.team].color=b.dataset.color;render()}));
  $('#rounds').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;setupDraft.rounds=+b.dataset.r;readSetup();render()});
  $('#start').addEventListener('click',()=>{readSetup();S=newGame(setupDraft);history=[];ui.confirm=false;save();render()});
}
function readSetup(){
  for(let i=0;i<setupDraft.numTeams;i++){const T=setupDraft.teams[i],D=DEF_TEAMS[i];
    if(setupDraft.perTeam===1){T.solo=$('#tn'+i).value.trim()||D.solo;continue}
    T.name=$('#tn'+i).value.trim()||D.name;
    T.players[0]=$('#p'+i+'a').value.trim()||D.players[0];T.players[1]=$('#p'+i+'b').value.trim()||D.players[1]}
  try{localStorage.setItem(STORE,JSON.stringify({S:null,history:[],setupDraft}))}catch(e){}
}

function bindGame(){
  $('#board').addEventListener('click',e=>{const p=e.target.closest('.seg');
    if(p){if(S&&S.phase==='tb')tbThrow(+p.dataset.n,+p.dataset.m);else throwDart(+p.dataset.n,+p.dataset.m);return}
    if(e.target.id==='missring'&&S&&(S.phase==='tb'||(S.phase==='play'&&!S.pending))){if(S.phase==='tb')tbThrow(0,0);else throwDart(0,0);const m=$('#missring');if(m){m.classList.remove('flashmiss');void m.getBBox();m.classList.add('flashmiss')}}});

function bindApp(){
  $('#app').addEventListener('click',e=>{

    if(a==='tb-start')startTB();

    if(a==='extend'){snap();S.rounds+=+b.dataset.k;S.phase='play';S.endedAt=null;S.tbWinner=null;S.tb=null;S.pending=true;ui.review=false;save();render()}
    if(a==='next')advance();
    if(a==='keep'){ui.confirm=false;fillGame()}
    if(a==='end'||a==='setup'){S=null;history=[];ui.confirm=false;save();render()}
    if(a==='rematch'){const cfg={teams:S.teams,numTeams:S.teams.length,rounds:S.rounds,penalty:S.penalty};S=newGame(cfg);history=[];save();render()}
    if(a==='settings-open'){ui.settings={teams:JSON.parse(JSON.stringify(S.teams)),rounds:S.rounds,penalty:S.penalty==null?0.5:S.penalty};renderSettings()}
    if(a==='set-cancel'){ui.settings=null;renderSettings();render()}
    if(a==='set-rminus'||a==='set-rplus'){readSettings();const d=ui.settings;d.rounds=Math.max(S.round,Math.min(30,d.rounds+(a==='set-rplus'?1:-1)));renderSettings()}
    if(a==='set-pen'){readSettings();ui.settings.penalty=+b.dataset.k;renderSettings()}
    if(a==='set-color'){if(b.disabled)return;readSettings();ui.settings.teams[+b.dataset.team].color=b.dataset.color;renderSettings()}
    if(a==='set-save'){readSettings();snap();const d=ui.settings;S.teams=d.teams;S.rounds=d.rounds;S.penalty=d.penalty;
      if(S.pending&&!nextUp())S.phase='over';else if(S.phase==='over'&&nextUp()){S.phase='play';S.endedAt=null;ui.review=false}
      ui.settings=null;renderSettings();save();render()}

  });
}

function fitText(el,max,min){if(!el)return;let s=max;el.style.fontSize=s+'px';
  while(s>min&&(el.scrollWidth>el.clientWidth+1||el.scrollHeight>s*0.9*2+4)){s-=2;el.style.fontSize=s+'px'}}
function fitNames(){const w=window.innerWidth;fitText($('#thrower .tname'),w<=700?30:w<620?44:64,12);fitText($('#ondeck .dname'),w<=700?22:w<620?30:40,11)}
window.addEventListener('resize',()=>{if(S&&$('#thrower'))fitNames()});
try{document.fonts.ready.then(()=>{if(S&&$('#thrower'))fitNames()})}catch(e){}
function fmtDur(ms){ms=Math.max(0,ms);const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),sec=t%60;const p=n=>String(n).padStart(2,'0');return h?`${h}:${p(m)}:${p(sec)}`:`${m}:${p(sec)}`}
function tick(){const el=$('#timer');if(!el||!S||!S.startedAt)return;const now=S.phase==='over'&&S.endedAt?S.endedAt:Date.now();
  el.innerHTML=`Game <b>${fmtDur(now-S.startedAt)}</b>${S.phase==='over'?'':` · Round <b>${fmtDur(now-(S.roundStartedAt||S.startedAt))}</b>`}`;
  el.title=S.timerJoined?'Timer started when it was added mid-game':''}
setInterval(tick,1000);
const fmtD=d=>d==null?'':d>0?'+'+d:d<0?'−'+Math.abs(d):'0';
function feedHTML(feed){let out='',lastR=null;
  for(const f of feed){if(f.r!=null&&f.r!==lastR){out+=`<li class="sep">${f.r==='TB'?'Tiebreaker':'Round '+f.r}</li>`;lastR=f.r}
    const cls=f.d==null||f.d===0?'zero':f.d>0?'pos':'neg';
    const opp=(f.opp||[]).map(([i,v])=>`<span style="color:var(--t${i})">${esc(S.teams[i]?S.teams[i].name:'')} ${fmtD(v)}</span>`).join(' · ');
    out+=`<li><span class="who" style="color:var(--t${f.team})">${esc(f.who)}</span><span class="hit">${f.label}</span><span class="what">${esc(f.text)}${opp?`<span class="opp">${opp}</span>`:''}</span><span class="delta ${cls}">${f.d==null?'':fmtD(f.d)}</span></li>`}
  return out}
function playerStats(){const m=new Map();
  S.teams.forEach((t,i)=>t.players.forEach(p=>m.set(i+'|'+p,{team:i,name:p,darts:0,gain:0,dmg:0,lock:0,steal:0,brk:0,off:0})));
  for(const f of S.feed){if(f.tb)continue;const k=f.team+'|'+f.who;if(!m.has(k))m.set(k,{team:f.team,name:f.who,darts:0,gain:0,dmg:0,lock:0,steal:0,brk:0,off:0});const p=m.get(k);
    p.darts++;p.gain+=f.d||0;(f.opp||[]).forEach(([,v])=>{if(v<0)p.dmg-=v});
    if(f.kind==='lock')p.lock++;if(f.kind==='steal')p.steal++;if(f.kind==='break')p.brk++;if(f.kind==='off'||f.label==='OFF')p.off++}
  const arr=[...m.values()].map(p=>({...p,gain:+p.gain.toFixed(2),dmg:+p.dmg.toFixed(2),impact:+(p.gain+p.dmg).toFixed(2)}));
  return arr.sort((a,b)=>b.impact-a.impact||b.gain-a.gain)}
function dartsLeft(i,k){if(!S||S.phase!=='play')return 0;const N=NT(),slot=k*N+i;
  let d=(S.rounds-S.round)*3;if(slot>S.turnIdx)d+=3;else if(slot===S.turnIdx&&!S.pending)d+=3-S.darts.length;return Math.max(0,d)}
const leftBadge=n=>n?`<span class="left" title="Darts left in the game">${n} left</span>`:'<span class="left done">Done</span>';
// 4 players x 6 rounds = about 30 minutes, so each turn is about 1.25 minutes
function estMin(turns){return Math.max(5,Math.round(turns*1.25/5)*5)}
function extendBtns(){const t=NT()*PP();return[1,2,3].map(k=>`<button class="btn big" data-act="extend" data-k="${k}">+${k} round${k>1?'s':''} <span style="color:var(--muted);font-weight:500">~${Math.max(1,Math.round(k*t*1.25))} min</span></button>`).join('')}
function topTied(){const T=S.teams.map((_,i)=>({i,v:tally(i).total}));const lead=Math.max(...T.map(x=>x.v));return T.filter(x=>x.v===lead).map(x=>x.i)}
function pickTarget(prev){const opts=[...ORDER,25].filter(n=>n!==prev);return opts[Math.floor(Math.random()*opts.length)]}
function startTB(){snap();const sides=topTied();S.tb={sides,target:pickTarget(),cycle:1,idx:0,cycleHits:[],log:[],msg:''};S.phase='tb';S.pending=false;S.endedAt=null;ui.review=false;save();render()}
function tbWho(side){const pl=S.teams[side].players;return pl[(S.tb.cycle-1)%pl.length]}
function tbThrow(n,mult){if(!S||S.phase!=='tb')return;buzz(n);snap();const tb=S.tb,side=tb.sides[tb.idx],who=tbWho(side);setTimeout(()=>hitPop(n,mult,`var(--t${side})`),0);
  const hit=n===tb.target;const label=n<=0?(n===-1?'OFF':'Miss'):hitLabel(n,mult);
  tb.log.push({team:side,who,hit,label,cycle:tb.cycle});if(hit)tb.cycleHits.push(side);
  S.feed.unshift({team:side,who,label,text:hit?`hit ${numName(tb.target)}`:`missed ${numName(tb.target)}`,kind:hit?'tbhit':'tbmiss',r:'TB',tb:1});
  tb.idx++;tb.msg='';
  if(tb.idx>=tb.sides.length){const h=tb.cycleHits;
    if(h.length===1){S.tbWinner=h[0];S.tbTarget=tb.target;S.phase='over';S.pending=false;S.endedAt=Date.now()}
    else{if(h.length>=2){const out=tb.sides.filter(x=>!h.includes(x));tb.msg=out.length?`${h.map(i=>S.teams[i].name).join(' and ')} both hit. ${out.map(i=>S.teams[i].name).join(' and ')} ${out.length>1?'are':'is'} out. Hits cancel, go again.`:'Everyone hit, so the hits cancel. Go again.';tb.sides=h}
      else tb.msg='Nobody hit it. Go again.';
      tb.cycle++;tb.idx=0;tb.cycleHits=[]}}
  else if(hit&&tb.idx<tb.sides.length)tb.msg=`${who} hit ${numName(tb.target)}! ${tbWho(tb.sides[tb.idx])} has to hit it to cancel.`;
  save();render();
  if(n>0){const el=document.querySelector(`[data-n="${n}"][data-m="${mult}"]`);if(el){el.classList.remove('flash');void el.getBBox();el.classList.add('flash')}}}
function tbHTML(){const tb=S.tb;const side=tb.sides[tb.idx];
  const cur=tb.log.filter(x=>x.cycle===tb.cycle);
  return`<div class="tbbar"><div class="tbtarget"><div class="l">Tiebreaker · first to hit</div><div class="v">${numName(tb.target)}</div></div>
    <div class="tbinfo"><div>${tb.sides.map(i=>{const d=cur.find(x=>x.team===i);return`<span class="tbside" style="--tc:var(--t${i})">${esc(S.teams[i].name)} ${d?(d.hit?'<b class="ok">✓ hit</b>':'<b class="no">✗</b>'):''}</span>`}).join('')}</div>
    <div class="tbmsg">${esc(tb.msg||'One dart each, in order. Any single, double or triple of the number counts. If the first thrower hits, the next thrower can cancel it by hitting too.')}</div>
    <div class="tbmeta">Pass ${tb.cycle}${tb.log.length?'':' · <button class="btn" data-act="tb-reroll">Pick a different number</button>'}</div></div></div>`}
function fillGame(){

    const rank=T.findIndex(x=>x.t.total===t.total)+1;const upIdx=c.team===i&&!S.pending?c.player:-1;

      <div class="stats">${t.held} numbers · ${t.locks} locked${t.chain?` · chain +${t.chain}`:''}${t.pen?` · <span style="color:#ff8f8f">−${t.pen} off</span>`:''}</div></div>

    if(Math.abs(d)>2&&el.animate)el.animate([{transform:`translateY(${d}px)`},{transform:'none'}],{duration:450,easing:'cubic-bezier(.2,.8,.2,1)'})});

const KIND={lock:'Closed out',steal:'Stole',break:'Broke lock on',neutral:'Knocked out',claim:'Claimed',reinforce:'Built up',weaken:'Weakened'};
const HOT=['lock','steal','break','neutral'];
function recapHTML(lt,n){
  const turn=lt.turn&&lt.turn.length?lt.turn:lt.darts.map(l=>({label:l,text:'',kind:'none'}));
  const groups={};turn.forEach(d=>{if(KIND[d.kind]){(groups[d.kind]=groups[d.kind]||[]);if(!groups[d.kind].includes(d.nn))groups[d.kind].push(d.nn)}});
  const order=['lock','steal','break','neutral','claim','reinforce','weaken'];
  const offs=turn.filter(d=>d.kind==='off').length,pen=S.penalty==null?0.5:S.penalty;
  const chips=order.filter(k=>groups[k]).map(k=>`<span class="chip ${k}">${KIND[k]} ${groups[k].join(', ')}</span>`).join('')+(offs?`<span class="chip off">Off the board${offs>1?' ×'+offs:''}${pen?` (−${offs*pen})`:''}</span>`:'');
  let headline;
  if(groups.lock)headline=`Closed out ${groups.lock.join(' and ')}`;
  else if(groups.steal)headline=`Stole ${groups.steal.join(' and ')}`;
  else if(groups.break)headline=`Broke the lock on ${groups.break.join(' and ')}`;
  else if(offs===3)headline='Three darts, zero board';
  else if(chips&&offs&&!Object.keys(groups).length)headline='Hit the wall';
  else if(chips)headline='Turf in play';
  else headline='No turf changed';
  const hasD=turn.some(d=>d.d!=null);const gain=+turn.reduce((a,d)=>a+(d.d||0),0).toFixed(2);
  const dmg={};turn.forEach(d=>(d.opp||[]).forEach(([i,v])=>{if(v<0)dmg[i]=(dmg[i]||0)-v}));
  const dmgLine=Object.keys(dmg).length?`<div class="recap" style="margin-top:6px">Took ${Object.entries(dmg).map(([i,v])=>`<b style="color:var(--t${i})">${+v.toFixed(2)} from ${esc(S.teams[i].name)}</b>`).join(', ')}</div>`:'';
  const minis=S.teams.map((t,i)=>`<span style="color:var(--t${i})"><b>${tally(i).total}</b>${esc(t.name)}</span>`).join('');
  return`<div class="pending-card" role="dialog" aria-label="Turn recap" style="--tc:var(--t${lt.team});--tink:var(--t${lt.team}-ink)">
    <div class="turnhead"><div><div class="eyebrow">Turn over · pull your darts</div>
    <div class="headline" style="margin-top:6px"><span style="color:var(--t${lt.team})">${esc(lt.who)}</span>: ${headline}</div>${dmgLine}</div>
    ${hasD?`<div class="turngain ${gain>0?'pos':gain<0?'neg':'zero'}"><div class="v">${fmtD(gain)}</div><div class="l">${Math.abs(gain)===1?'point':'points'} this turn</div></div>`:''}</div>
    ${chips?`<div class="chips">${chips}</div>`:''}
    <ul class="recaplist">${turn.map(d=>`<li class="${HOT.includes(d.kind)?'hot':''}"><span class="lbl">${d.label}</span><span class="txt">${esc(d.text)}</span><span class="dd ${d.d==null||d.d===0?'zero':d.d>0?'pos':'neg'}">${d.d==null?'':fmtD(d.d)}</span></li>`).join('')}</ul>
    <div class="minis">${minis}</div>
    <div class="nextrow"><div><div class="eyebrow">Up next</div><div class="who" style="color:var(--t${n.team})">${esc(n.name)}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn big" data-act="undo">↶ Undo last dart</button><button class="btn primary big" data-act="next">Start ${esc(n.name)}'s turn</button></div></div></div>`;
}

function timeHTML(){if(!S.startedAt)return'';const end=S.endedAt||Date.now();const rt=(S.roundTimes||[]).concat([end-(S.roundStartedAt||S.startedAt)]);
  const avg=rt.reduce((a,b)=>a+b,0)/rt.length;
  return`<div class="shame">Game length <b style="color:var(--chalk)">${fmtDur(end-S.startedAt)}</b>${S.timerJoined?' (since the timer was added)':''} · average round <b style="color:var(--chalk)">${fmtDur(avg)}</b></div>`}
function shameHTML(){const e=Object.entries(S.shame||{}).sort((a,b)=>b[1]-a[1]);if(!e.length)return'<div class="shame">Wall of shame: empty. Every dart hit the board.</div>';
  const top=e[0][1];const worst=e.filter(x=>x[1]===top).map(x=>esc(x[0]));
  return`<div class="shame">Wall of shame: <b>${worst.join(' and ')}</b> missed the board ${top} time${top>1?'s':''}.</div>`}
function resultView(){
  const T=S.teams.map((_,i)=>tally(i));

  const a=T[rank[0]],b=T[rank[1]];
  const tied=a.total===b.total;const w=tied?(S.tbWinner!=null?S.tbWinner:null):rank[0];
  const tiedNames=topTied().map(i=>esc(S.teams[i].name));
  const head=w===null?`Tied at ${a.total}`:`${esc(S.teams[w].name)} wins`;
  const sub=w===null?`${tiedNames.join(' and ')} are level. Settle it with a tiebreaker or play more rounds.`:tied?`Won the tiebreaker on ${numName(S.tbTarget)} after a ${a.total}–${a.total} tie.`:`${rank.map(i=>T[i].total).join(' to ')}`;
  const row=(l,f)=>`<tr><td>${l}</td>${T.map(t=>`<td>${f(t)}</td>`).join('')}</tr>`;
  const ps=playerStats();const mvp=ps[0]&&ps[0].darts?ps[0]:null;
  return`<div class="overlay"><div class="result wide">
    <div><div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600">Final after ${S.rounds} rounds</div>

    <div style="overflow-x:auto"><table><thead><tr><th></th>${S.teams.map((t,i)=>`<th style="color:var(--t${i})">${esc(t.name)}<div style="font-family:var(--font-body);font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:0;text-transform:none;margin-top:2px">${T[i].held} held · ${T[i].locks} locked</div></th>`).join('')}</tr></thead>
    <tbody>${row('Held numbers <small style="opacity:.7">1 pt each</small>',t=>t.heldPts)}${row('Locked numbers <small style="opacity:.7">2 pts each</small>',t=>t.lockPts?'+'+t.lockPts:'0')}${row('Bull <small style="opacity:.7">counts double</small>',t=>t.bull?'+'+t.bull:'0')}${row('Chain bonus',t=>t.chain?'+'+t.chain:'0')}${row('Off the board',t=>t.pen?'−'+t.pen:'0')}</tbody>
    <tfoot><tr><td>Total <small style="font-family:var(--font-body);font-size:12px;color:var(--muted)">sum of the rows above</small></td>${T.map(t=>`<td>${t.total}</td>`).join('')}</tr></tfoot></table></div>
    ${timeHTML()}
    ${shameHTML()}
    <div style="display:flex;flex-direction:column;gap:8px"><h3>Player scorecard</h3>
    ${mvp?`<div class="shame">MVP: <b style="color:var(--t${mvp.team})">${esc(mvp.name)}</b> with ${fmtD(mvp.gain)} for ${S.teams.length>2||S.teams[0].players.length>1?'the team':'themselves'} and ${mvp.dmg} taken from opponents.</div>`:''}
    <div style="overflow-x:auto"><table class="pstats"><thead><tr><th>Player</th><th>Darts</th><th>Points won</th><th>Taken from others</th><th>Locks</th><th>Steals</th><th>Lock breaks</th><th>Off board</th></tr></thead>
    <tbody>${ps.map(p=>`<tr><td><span style="color:var(--t${p.team})">${esc(p.name)}</span></td><td>${p.darts}</td><td>${fmtD(p.gain)}</td><td>${p.dmg}</td><td>${p.lock}</td><td>${p.steal}</td><td>${p.brk}</td><td>${p.off}</td></tr>`).join('')}</tbody></table></div>
    <div class="shame">Points won counts every point change a player's darts caused for their own side, including penalties. Taken from others is what their darts knocked off opponents.</div></div>
    <details><summary>Full play-by-play (${S.feed.length} darts)</summary><ul class="feed" style="margin-top:10px">${feedHTML(S.feed)}</ul></details>
    <div class="actions">${w===null?'<button class="btn primary big" data-act="tb-start">Start tiebreaker</button>':''}${extendBtns()}</div>

  </div></div>`;
}

  const players=d.players.slice(0,d.n).map(p=>({name:p.name,color:p.color}));
  const nums=shuffle([...Array(20)].map((_,i)=>i+1));
  players.forEach((p,i)=>{
    if(d.game==='x01')Object.assign(p,{rem:o.start,turnStart:o.start,opened:!o.din,scored:0,darts:0,best:0,turnPts:0});
    if(d.game==='cricket')Object.assign(p,{marks:{20:0,19:0,18:0,17:0,16:0,15:0,25:0},pts:0,darts:0,mpr:0});

function cBonus(name,i){let el=$('#offtoast');if(el)el.remove();el=document.createElement('div');el.id='offtoast';el.className='offtoast bonus';el.setAttribute('role','status');el.style.setProperty('--tc',`var(--t${i})`);

/* ---------- checkout helper ---------- */
const CO_ALL=(()=>{const a=[];for(let i=20;i>=1;i--)a.push({l:'T'+i,v:3*i});a.push({l:'Bull',v:50});for(let i=20;i>=1;i--)a.push({l:'D'+i,v:2*i});a.push({l:'25',v:25});for(let i=20;i>=1;i--)a.push({l:'S'+i,v:i});return a})();
const CO_D=CO_ALL.filter(d=>d.l[0]==='D'||d.l==='Bull');
function checkout(rem,darts,dout){if(rem<=0||rem>170||darts<1)return null;const fin=dout?CO_D:CO_ALL;
  let f=fin.find(d=>d.v===rem);if(f)return[f.l];if(darts<2)return null;
  for(const a of CO_ALL){f=fin.find(d=>d.v===rem-a.v);if(f)return[a.l,f.l]}if(darts<3)return null;
  for(const a of CO_ALL)for(const b of CO_ALL){f=fin.find(d=>d.v===rem-a.v-b.v);if(f)return[a.l,b.l,f.l]}return null}

function cAim(p){const g=C.game,o=C.opts;
  if(g==='x01'){if(!p.opened)return'Need a double to start';const co=checkout(p.rem,3-C.darts.length,o.dout);return`${p.rem} left${co?' · '+co.join(' '):''}`}
  if(g==='atw'){const T=atwTargets();return`Aim for ${numName(T[p.ti])}`}
  if(g==='killer')return p.killer?'Killer · hit their numbers':o.kmode==='double'?`Hit D${p.num} to become a killer`:`Hit ${p.num} to become a killer · ${p.hits||0} of 3`;
  if(g==='bingo'){const b=bingoBest(C.turn);return b?`Best line ${b} of 5 · claim 3 marks per square`:'Claim squares: 3 marks each'}
  if(g==='bounty'){const t=C.targets[C.round-1];const w=C.wanted;return`Aim ${t===25?'Bull':t} · $${t===25?25:t}/mark${w!=null&&w!==C.turn?` · ${t===25?'bullseye':'triple'} robs ${C.players[w].name}`:w===C.turn?' · you\'re Wanted':''}`}
  if(g==='baseball'){const t=bbT(C.round);return`Inning ${C.round} · aim ${numName(t)} · ${p.runs} run${p.runs===1?'':'s'}`}
  if(g==='knockout'){const sum=C.turnLog.reduce((a,d)=>a+(d.delta||0),0);return C.koTarget==null?`Opening throw sets the score${sum?` · ${sum} so far`:''}`:`Need ${koNeed(C.koTarget)}${sum?` · ${sum} so far`:''}`}
  if(g==='cricket'){const open=CRICK.filter(k=>p.marks[k]<3);return open.length?`${open.length} number${open.length>1?'s':''} to close`:'All closed'}
  return''}

    const dv=f.delta==null?'':g==='x01'?(f.delta<0?String(-f.delta):'+'+f.delta):g==='bounty'?(f.delta<0?'−$'+(-f.delta):'+$'+f.delta):'+'+f.delta;

function cRecapHTML(){const p=cP(),g=C.game,ni=cNextIdx(C.turn),nx=C.players[ni];
  let big='',lbl='';
  if(g==='x01'){const s=p.bust?0:p.turnStart-p.rem;big=p.bust?'BUST':String(s);lbl=p.bust?`back to ${p.rem}`:`scored · ${p.rem} left`}
  if(g==='cricket'){const pts=C.turnLog.reduce((a,d)=>a+(d.delta||0),0);big=pts?'+'+pts:'0';lbl='points this turn'}
  if(g==='atw'){big=numName(atwTargets()[Math.min(p.ti,atwTargets().length-1)]);lbl='next target'}
  if(g==='bingo'){const c=C.turnLog.reduce((a,d)=>a+(d.delta||0),0);big=String(c);lbl=c===1?'square claimed':'squares claimed'}
  if(g==='bounty'){const st=C.settle||{pts:0};big=st.pts<0?'−$'+(-st.pts):'+$'+st.pts;lbl=st.bust?'went bust':st.stole?`incl. $${st.stole} robbed from ${C.players[st.from].name}`:'this turn';if(st.stole){big='+$'+(st.pts+st.stole)}}
  if(g==='baseball'){const r=C.turnLog.reduce((a,d)=>a+(d.delta||0),0);big=r?'+'+r:'0';lbl=`run${r===1?'':'s'} · ${p.runs} total`}
  if(g==='knockout'){const st=C.settle||{tot:0};big=String(st.tot);lbl=st.opening?'sets the score to beat':st.ok?'safe · new score to beat':p.out?'knocked out':`short of ${st.target} · ${p.lives} ${p.lives===1?'life':'lives'} left`}
  if(g==='killer'){big=p.out?'OUT':(p.killer?'☠':String(p.lives));lbl=p.out?'knocked out':(p.killer?`killer · ${p.lives} ${p.lives===1?'life':'lives'}`:`${p.lives} ${p.lives===1?'life':'lives'}`)}
  return`<div class="pending-card" role="dialog" aria-label="Turn recap" style="--tc:var(--t${C.turn});--tink:var(--t${C.turn}-ink)">
    <div class="turnhead"><div><div class="eyebrow">Turn over · pull your darts</div>
    <div class="headline" style="margin-top:6px;color:var(--t${C.turn})">${esc(p.name)}</div></div>
    <div class="turngain ${(g==='x01'&&p.bust)||(g==='bounty'&&C.settle&&C.settle.bust)||(g==='knockout'&&C.settle&&C.settle.lost)?'neg':'pos'}"><div class="v">${big}</div><div class="l">${esc(lbl)}</div></div></div>
    <ul class="recaplist">${C.turnLog.map(d=>`<li class="${/closed|KILLER|out!|checked|took|stole|bounty shot/.test(d.text)?'hot':''}"><span class="lbl">${d.label}</span><span class="txt">${esc(d.text)}</span><span class="dd"></span></li>`).join('')}</ul>
    <div class="nextrow"><div><div class="eyebrow">Up next</div><div class="who" style="color:var(--t${ni})">${esc(nx.name)}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn big" data-act="c-undo">↶ Undo last dart</button><button class="btn primary big" data-act="c-next">Start ${esc(nx.name)}'s turn</button></div></div></div>`}

function cMiniHTML(){const g=C.game,over=C.phase==='over';
  const val=p=>g==='x01'?p.rem:g==='cricket'?p.pts:g==='atw'?(p.ti>=atwTargets().length?'✓':numName(atwTargets()[p.ti])):g==='killer'||g==='knockout'?(p.out?'out':'♥'+p.lives):g==='bingo'?p.claims+'□':g==='baseball'?p.runs+'R':'$'+p.score;

function cScoreHTML(){const g=C.game,over=C.phase==='over';
  const row=(i,rank,mid,right,extra='')=>{const p=C.players[i],act=!over&&C.turn===i;
    return`<div class="team${act?' active':''}${rank===1?' first':''}${p.out?' done':''}" style="--tc:var(--t${i})"><div class="rank">${rank}</div><div class="mid"><div class="name">${esc(p.name)}</div>${mid}</div><div class="right">${right}</div>${extra}</div>`};
  const idx=C.players.map((_,i)=>i);

    return`<div class="teams">${idx.map((i,k)=>{const p=C.players[i];const avg=p.darts?(p.scored/p.darts*3).toFixed(1):'–';
      const co=p.rem<=170?checkout(p.rem,3,C.opts.dout):null;
      return row(i,idx.findIndex(j=>C.players[j].rem===p.rem)+1,`<div class="stats">3-dart avg ${avg}${p.best?` · best ${p.best}`:''}${!p.opened?' · needs a double':''}${co?` · out: ${co.join(' ')}`:''}</div>`,`<div class="score">${p.rem}</div><div class="gap">left</div>`)}).join('')}</div>`}
  if(g==='atw'){const T=atwTargets();idx.sort((a,b)=>C.players[b].ti-C.players[a].ti);
    return`<div class="teams">${idx.map(i=>{const p=C.players[i];const pct=Math.round(p.ti/T.length*100);
      return row(i,idx.findIndex(j=>C.players[j].ti===p.ti)+1,`<div class="bar"><span style="width:${pct}%"></span></div><div class="stats">${p.ti} of ${T.length} done · ${p.darts} darts</div>`,`<div class="score">${p.ti>=T.length?'✓':numName(T[p.ti])}</div><div class="gap">${p.ti>=T.length?'finished':'target'}</div>`)}).join('')}</div>`}
  if(g==='killer'){idx.sort((a,b)=>(C.players[a].out-C.players[b].out)||(C.players[b].lives-C.players[a].lives));
    return`<div class="teams">${idx.map(i=>{const p=C.players[i];const hearts='♥'.repeat(p.lives)+'<span style="opacity:.25">'+'♥'.repeat(Math.max(0,C.opts.lives-p.lives))+'</span>';
      return row(i,p.out?'–':idx.filter(j=>!C.players[j].out).indexOf(i)+1,`<div class="stats"><span class="hearts" style="color:var(--tc)">${hearts}</span>${p.killer?' <span class="kchip">KILLER</span>':(C.opts.kmode!=='double'&&!p.out?` <span style="color:var(--tc);font-family:var(--font-display);font-size:17px">${'╱'.repeat(p.hits||0)}<span style="opacity:.25">${'╱'.repeat(Math.max(0,3-(p.hits||0)))}</span></span>`:'')}${p.out?' · out':''}${p.kills?` · ${p.kills} KO`:''}</div>`,`<div class="score knum">${p.num}</div><div class="gap">${C.opts.kmode==='double'?'hit D'+p.num:'number'}</div>`)}).join('')}</div>`}
  if(g==='bingo'){const me=over?-1:C.turn;
    const cellHTML=(cell,i)=>{const own=cell.owner;const win=C.winLine&&C.winLine.includes(i);
      const myM=me>=0?cell.marks[me]:0;const others=cell.marks.map((v,j)=>({v,j})).filter(x=>x.j!==me&&x.v>0&&own==null);
      const glyph=own!=null?'':myM>=2?'✕':myM===1?'╱':'';
      const lab=typeof cell.k==='number'?cell.k:cell.k==='BULL'?'BULL':cell.k==='OE'?'ODD/<br>EVEN':bingoLabel(cell.k).toUpperCase();
      return`<div class="bcell${own!=null?' own':''}${win?' win':''}${typeof cell.k==='number'?'':' spec'}" style="${own!=null?`--tc:var(--t${own})`:me>=0?`--tc:var(--t${me})`:''}"><span class="bl">${lab}</span>${glyph?`<span class="bg">${glyph}</span>`:''}${others.length?`<span class="bo">${others.map(x=>`<i style="--oc:var(--t${x.j})" title="${esc(C.players[x.j].name)}: ${x.v} of 3">${x.v>=2?'✕':'╱'}</i>`).join('')}</span>`:''}</div>`};
    idx.sort((a,b)=>C.players[b].claims-C.players[a].claims);
    return`<div class="card" style="padding:10px"><div class="bcard">${C.card.map(cellHTML).join('')}</div></div>
      <div class="teams">${idx.map(i=>{const p=C.players[i];return row(i,idx.findIndex(j=>C.players[j].claims===p.claims)+1,`<div class="stats">best line ${bingoBest(i)} of 5</div>`,`<div class="score">${p.claims}</div><div class="gap">squares</div>`)}).join('')}</div>`}
  if(g==='bounty'){const t=C.targets[Math.min(C.round,C.rounds)-1];idx.sort((a,b)=>C.players[b].score-C.players[a].score);
    return`<div class="bposter"><span class="r">Round ${Math.min(C.round,C.rounds)}/${C.rounds}</span>${t===25?'<span class="noon">High Noon</span>':''}<div class="w">Wanted</div><div class="tgt">${t===25?'BULL':t}</div><div class="pay">$${t===25?25:t} per mark${C.wanted!=null?` · leader: <b style="color:var(--t${C.wanted})">${esc(C.players[C.wanted].name)}</b>`:''}</div></div>
    <div class="teams">${idx.map(i=>{const p=C.players[i];return row(i,idx.findIndex(j=>C.players[j].score===p.score)+1,`<div class="stats">${i===C.wanted?'<span class="kchip">WANTED</span> ':''}${p.marks} marks · ${p.tops} ${'triples'} · ${p.steals} robberies${p.busts?` · ${p.busts} busts`:''}</div>`,`<div class="score">$${p.score}</div>`)}).join('')}</div>`}
  if(g==='baseball'){const N=Math.max(C.opts.bbInn,C.round),cols=[...Array(N).keys()];const lead=Math.max(...C.players.map(p=>p.runs));
    return`<div class="card" style="padding:10px 8px;overflow-x:auto"><table class="ctable"><thead><tr><th></th>${cols.map(k=>`<th class="${k+1===C.round&&!over?'cur':''}" style="${k+1===C.round&&!over?'color:var(--chalk)':''}">${bbT(k+1)===25?'B':k+1}</th>`).join('')}<th>R</th></tr></thead>
      <tbody>${C.players.map((p,i)=>`<tr class="${!over&&C.turn===i?'act':''}" style="--tc:var(--t${i});${p.out&&!over?'opacity:.45':''}"><td class="pn">${esc(p.name)}</td>${cols.map(k=>`<td style="color:var(--tc)">${p.inn[k]!=null?p.inn[k]:''}</td>`).join('')}<td class="pts${p.runs===lead&&lead>0?' lead':''}">${p.runs}</td></tr>`).join('')}</tbody></table></div>`}
  if(g==='knockout'){const t=C.koTarget;idx.sort((a,b)=>(C.players[a].out-C.players[b].out)||(C.players[b].lives-C.players[a].lives));
    return`<div class="bposter"><span class="r">Round ${C.round}</span><div class="w">Score to beat</div><div class="tgt">${t==null?'–':t}</div><div class="pay">${t==null?'The first throw sets it':`set by <b style="color:var(--t${C.koBy})">${esc(C.players[C.koBy].name)}</b> · ${C.opts.koTie==='strike'?'beat it':'match or beat it'}`}</div></div>
    <div class="teams">${idx.map(i=>{const p=C.players[i];const hearts='♥'.repeat(p.lives)+'<span style="opacity:.25">'+'♥'.repeat(Math.max(0,C.opts.koLives-p.lives))+'</span>';
      return row(i,p.out?'–':idx.filter(j=>!C.players[j].out).indexOf(i)+1,`<div class="stats"><span class="hearts" style="color:var(--tc)">${hearts}</span>${p.out?' · out':''}${p.best?` · best ${p.best}`:''}</div>`,`<div class="score">${p.last==null?'–':p.last}</div><div class="gap">last turn</div>`)}).join('')}</div>`}
  if(g==='cricket'){
    const cell=k=>k>=3?'<span class="cmk c3">✕</span>':k===2?'<span class="cmk">✕</span>':k===1?'<span class="cmk">╱</span>':'';
    const dead=n=>C.players.every(p=>p.marks[n]>=3);
    const lead=Math.max(...C.players.map(p=>p.pts));
    return`<div class="card" style="padding:10px 8px;overflow-x:auto"><table class="ctable"><thead><tr><th></th>${CRICK.map(n=>`<th class="${dead(n)?'dead':''}">${n===25?'B':n}</th>`).join('')}${C.opts.cpts?'<th>Pts</th>':''}</tr></thead>
      <tbody>${C.players.map((p,i)=>`<tr class="${!over&&C.turn===i?'act':''}" style="--tc:var(--t${i})"><td class="pn">${esc(p.name)}</td>${CRICK.map(n=>`<td class="${dead(n)?'dead':''}" style="color:var(--tc)">${cell(p.marks[n])}</td>`).join('')}${C.opts.cpts?`<td class="pts${p.pts===lead&&lead>0?' lead':''}">${p.pts}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
  return''}

function cPaint(){const svg=$('#board');if(!svg)return;const g=C.game,p=cP(),over=C.phase==='over',o=C.opts;oppMarks(null);
  svg.classList.toggle('locked',over||C.pending||!!C.alloc);
  const all=[...ORDER,25];

    const mg=$('#mk-'+n);if(mg){[1,2,3].forEach(k=>mg.querySelectorAll('.X'+k).forEach(e=>e.style.opacity=0))}
    if(n!==25){const b=$('#bd-'+n),ci=b.querySelector('circle'),tx=b.querySelector('text');ci.style.fill='transparent';ci.style.stroke='transparent';tx.style.fill='var(--chalk)'}}
  $('#bull-ring').style.stroke='transparent';
  svg.querySelectorAll('.seg').forEach(e=>e.classList.remove('tbt'));
  const dim=n=>{const o=$('#ov-'+n);o.style.fill='var(--bg)';o.setAttribute('fill-opacity',.6)};
  const glow=n=>svg.querySelectorAll(`.seg[data-n="${n}"]`).forEach(e=>e.classList.add('tbt'));
  const badge=(n,col,solid)=>{if(n===25){$('#bull-ring').style.stroke=col;return}const b=$('#bd-'+n),ci=b.querySelector('circle'),tx=b.querySelector('text');ci.style.stroke=col;ci.style.fill=solid?col:'transparent';tx.style.fill=solid?'var(--bg)':col};
  if(g==='cricket'){
    for(const n of all){if(!CRICK.includes(n)){dim(n);continue}
      const k=p.marks[n],mg=$('#mk-'+n);if(mg){[1,2,3].forEach(j=>mg.querySelectorAll('.X'+j).forEach(e=>e.style.opacity=k>=j?1:0));mg.querySelectorAll('.c').forEach(e=>e.style.stroke=`var(--t${C.turn})`)}
      if(C.players.every(q=>q.marks[n]>=3)){const o=$('#ov-'+n);o.style.fill='#000';o.setAttribute('fill-opacity',.55)}
      else badge(n,`var(--t${C.turn})`,k>=3)}
    const om={};for(const n of CRICK){om[n]=C.players.map((q,j)=>({j,v:q.marks[n]})).filter(x=>x.j!==C.turn&&x.v>0&&!C.players.every(q=>q.marks[n]>=3))}if(!over)oppMarks(om)}
  if(g==='atw'){const T=atwTargets(),t=T[Math.min(p.ti,T.length-1)];
    for(const n of all){if(n!==t)dim(n)}if(!over){glow(t);badge(t,`var(--t${C.turn})`,true)}}
  if(g==='bingo'){const owned={};C.card.forEach(c=>{if(typeof c.k==='number'&&c.owner!=null)owned[c.k]=c.owner;if(c.k==='BULL'&&c.owner!=null)owned[25]=c.owner});
    for(const n of all){if(owned[n]!=null){const o=$('#ov-'+n);o.style.fill=`var(--t${owned[n]})`;o.setAttribute('fill-opacity',.4);badge(n,`var(--t${owned[n]})`,true);continue}
      const cell=C.card.find(c=>c.k===(n===25?'BULL':n));const k=cell?cell.marks[C.turn]:0;const mg=$('#mk-'+n);
      if(mg&&!over){[1,2,3].forEach(j=>mg.querySelectorAll('.X'+j).forEach(e=>e.style.opacity=k>=j?1:0));mg.querySelectorAll('.c').forEach(e=>e.style.stroke=`var(--t${C.turn})`)}}
    if(!over){const om={};C.card.forEach(c=>{if(typeof c.k==='number'&&c.owner==null)om[c.k]=c.marks.map((v,j)=>({j,v})).filter(x=>x.j!==C.turn&&x.v>0)});oppMarks(om)}}
  if(g==='bounty'){const t=C.targets[Math.min(C.round,C.rounds)-1];for(const n of all){if(n!==t)dim(n)}if(!over){glow(t);badge(t,`var(--t${C.turn})`,true)}}
  if(g==='baseball'){const t=bbT(C.round);for(const n of all){if(n!==t)dim(n)}if(!over){glow(t);badge(t,`var(--t${C.turn})`,true)}}
  if(g==='killer'){const owned={};C.players.forEach((q,i)=>{if(!q.out)owned[q.num]=i});
    for(const n of all){if(owned[n]==null){dim(n);continue}const i=owned[n];const o=$('#ov-'+n);o.style.fill=`var(--t${i})`;o.setAttribute('fill-opacity',.32);badge(n,`var(--t${i})`,true)}
    if(!over&&!p.out){if(!p.killer)glow(p.num);else Object.keys(owned).forEach(n=>{if(+n!==p.num)glow(+n)})}
    if(!over&&!p.out&&!p.killer&&o.kmode!=='double'){const mg=$('#mk-'+p.num),k=p.hits||0;if(mg){[1,2,3].forEach(j=>mg.querySelectorAll('.X'+j).forEach(e=>e.style.opacity=k>=j?1:0));mg.querySelectorAll('.c').forEach(e=>e.style.stroke=`var(--t${C.turn})`)}}}
}

function oppMarks(map){const svg=$('#board');if(!svg)return;let gEl=svg.querySelector('#oppmarks');
  if(!gEl){gEl=document.createElementNS('http://www.w3.org/2000/svg','g');gEl.id='oppmarks';gEl.setAttribute('pointer-events','none');const firstBadge=svg.querySelector('.badge');svg.insertBefore(gEl,firstBadge)}
  if(!map){gEl.innerHTML='';return}
  let out='';for(const n of Object.keys(map)){const list=map[n];if(!list.length||+n===25)continue;const c=-90+ORDER.indexOf(+n)*18;
    const step=list.length>1?Math.min(17,52/(list.length-1)):0;const sc=list.length>3?.42:.5;
    list.forEach((x,k)=>{const[px,py]=pt(84-k*step,c);const col=`var(--t${x.j})`;
      out+=`<g transform="translate(${px} ${py}) scale(${sc})" stroke="${col}" stroke-width="5" stroke-linecap="round" fill="none"><g stroke="#000" stroke-width="9" opacity=".55"><path d="M-8 8L8 -8"/>${x.v>=2?'<path d="M-8 -8L8 8"/>':''}${x.v>=3?'<circle r="14"/>':''}</g><path d="M-8 8L8 -8"/>${x.v>=2?'<path d="M-8 -8L8 8"/>':''}${x.v>=3?'<circle r="14"/>':''}</g>`})}
  gEl.innerHTML=out}
function cResultHTML(){const g=C.game,w=C.winner,W=w==null?null:C.players[w];
  const rows=C.players.map((p,i)=>({p,i})).sort(g==='bounty'?(a,b)=>b.p.score-a.p.score:g==='baseball'?(a,b)=>b.p.runs-a.p.runs:(a,b)=>a.i===w?-1:b.i===w?1:0);
  const head={x01:['Left','Darts','3-dart avg','Best turn'],cricket:['Points','Closed','Darts','Marks/round'],atw:['Reached','Darts'],killer:['Lives','KOs','Darts'],bounty:['Cash','Marks','Triples','Robberies','Busts'],bingo:['Squares','Best line','Darts'],baseball:['Runs','Best inning','Darts'],knockout:['Lives','Best turn','Lives lost']}[g];
  const cells=p=>({x01:()=>[p.rem,p.darts,p.darts?(p.scored/p.darts*3).toFixed(1):'–',p.best||0],
    cricket:()=>[p.pts,CRICK.filter(k=>p.marks[k]>=3).length+' of 7',p.darts,p.darts?(p.mpr/p.darts*3).toFixed(2):'–'],
    atw:()=>[p.ti>=atwTargets().length?'Finished':numName(atwTargets()[p.ti]),p.darts],
    killer:()=>[p.out?'Out':p.lives,p.kills,p.darts],bounty:()=>['$'+p.score,p.marks,p.tops,p.steals,p.busts],bingo:()=>[p.claims,bingoBest(C.players.indexOf(p))+' of 5',p.darts],
    baseball:()=>[p.runs,Math.max(0,...p.inn.map(v=>v||0)),p.darts],knockout:()=>[p.out?'Out':p.lives,p.best||0,p.strikes]})[g]();
  return`<div class="overlay"><div class="result wide">
    <div><div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600">${esc(GAMES[g].name)} · ${C.round} round${C.round>1?'s':''} · ${fmtDur(C.endedAt-C.startedAt)}</div>
    ${W?`<h2 class="winner" style="color:var(--t${w})">${esc(W.name)} wins</h2>${g==='bounty'?`<div style="color:var(--muted)">$${W.score} in the saddlebag</div>`:''}`:`<h2 class="winner">Tied at $${C.players[C.tied[0]].score}</h2><div style="color:var(--muted)">${C.tied.map(i=>esc(C.players[i].name)).join(' & ')}: shoot for the bull, closest takes it.</div>`}</div>
    <div style="overflow-x:auto"><table class="pstats"><thead><tr><th>Player</th>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(({p,i})=>`<tr><td><span style="color:var(--t${i})">${esc(p.name)}</span>${i===w?' 🏆':''}${C.tied&&C.tied.length>1&&C.tied.includes(i)?' (tied)':''}</td>${cells(p).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="actions"><button class="btn primary big" data-act="c-rematch">Rematch</button><button class="btn big" data-act="c-setup">Change players</button><button class="btn big" data-act="g-menu">All games</button><button class="btn big" data-act="c-review">View board</button><button class="btn big" data-act="c-undo">↶ Undo last dart</button></div>
  </div></div>`}

/* ---------- events ---------- */
function bindClassic(){
  $('#app').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
    if(a==='g-assist'){setAssist(!assistOn());render();return}
    if(a==='g-menu'){appMode='menu';ui.cconfirm=false;csave();render();return}
    if(a==='g-turf'){if(S&&S.phase==='over'){S=null;history=[];ui.confirm=false;ui.review=false;save()}appMode='turf';csave();render();return}
    if(a==='g-classic'){appMode='classic';cdraft.game=b.dataset.game;if(cdraft.n<GAMES[cdraft.game].min)cdraft.n=GAMES[cdraft.game].min;if(cdraft.n>gMax(cdraft.game))cdraft.n=gMax(cdraft.game);cview='setup';csave();render();return}
    if(a==='g-cresume'){appMode='classic';cview='game';csave();render();return}
    if(!a.startsWith('c-'))return;
    if(a==='c-game'){readC();cdraft.game=b.dataset.v;if(cdraft.n<GAMES[cdraft.game].min)cdraft.n=GAMES[cdraft.game].min;if(cdraft.n>gMax(cdraft.game))cdraft.n=gMax(cdraft.game);csave();renderClassic()}
    if(a==='c-n'){readC();cdraft.n=+b.dataset.v;csave();renderClassic()}
    if(a==='c-opt'){readC();cdraft.opts[b.dataset.k]=pv(b.dataset.v);csave();renderClassic()}
    if(a==='c-color'){readC();cdraft.players[+b.dataset.p].color=b.dataset.color;csave();renderClassic()}
    if(a==='c-shuffle'){readC();const part=shuffle(cdraft.players.slice(0,cdraft.n));cdraft.players.splice(0,cdraft.n,...part);csave();renderClassic()}
    if(a==='c-start'){readC();ui.creview=false;cNew()}
    if(a==='c-pick'&&C&&C.alloc){C.alloc.sel[+b.dataset.d]=+b.dataset.i;ui.justPick=b.dataset.d+'-'+b.dataset.i;csave();cFill();ui.justPick=null;buzz(1)}
    if(a==='c-alloc')bingoCommit();
    if(a==='c-combo'&&C&&C.alloc){C.alloc.combo=b.dataset.k||null;csave();cFill()}
    if(a==='c-miss')cThrow(0,0);
    if(a==='c-off')cThrow(-1,0);
    if(a==='c-next')cNext();
    if(a==='c-undo'){ui.creview=false;cUndo()}
    if(a==='c-newask'){ui.cconfirm=true;cFill()}
    if(a==='c-keep'){ui.cconfirm=false;cFill()}
    if(a==='c-setup'){ui.cconfirm=false;ui.creview=false;C=null;chist=[];cview='setup';csave();renderClassic()}
    if(a==='c-rematch'){ui.creview=false;cdraft.game=C.game;cdraft.opts=JSON.parse(JSON.stringify(C.opts));cNew()}
    if(a==='c-review'){ui.creview=true;cFill()}
  });
  document.addEventListener('keydown',e=>{if(appMode!=='classic'||e.key!=='Enter'||e.repeat)return;const ae=document.activeElement;if(ae&&(ae.tagName==='BUTTON'||ae.tagName==='SUMMARY'))return;
    const al=document.querySelector('[data-act="c-alloc"]');if(al){e.preventDefault();al.click();return}
    const nx=document.querySelector('#cpending:not([hidden]) [data-act="c-next"]');if(nx){e.preventDefault();nx.click();return}
    const k=document.querySelector('[data-act="c-keep"]');if(k){e.preventDefault();k.click()}});
  setInterval(()=>{if(appMode==='classic'&&C&&C.phase==='play'&&$('#ctimer'))$('#ctimer').innerHTML=`Game <b>${fmtDur(Date.now()-C.startedAt)}</b>`},1000);
  window.addEventListener('resize',()=>{if(appMode==='classic'&&$('#thrower'))fitNames()});
}


/* ---------- phone helpers: haptics, tap assist, keep screen awake ---------- */
function nativeHaptic(kind){try{const H=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Haptics;if(!H)return false;
  if(kind==='heavy')H.impact({style:'HEAVY'});else if(kind==='success')H.notification({type:'SUCCESS'});else H.impact({style:kind==='medium'?'MEDIUM':'LIGHT'});return true}catch(e){return false}}
function buzz(n){if(nativeHaptic(n===-1?'heavy':n===0?'light':'medium'))return;try{if(navigator.vibrate)navigator.vibrate(n===-1?[40,40,90]:n===0?12:22)}catch(e){}}
const isPhone=()=>matchMedia('(max-width:700px)').matches;
function assistOn(){let v=null;try{v=localStorage.getItem('darts.assist')}catch(e){}return v==null?isPhone():v==='1'}
function setAssist(on){try{localStorage.setItem('darts.assist',on?'1':'0')}catch(e){}}
function routeThrow(n,m){if(appMode==='classic')cThrow(n,m);else if(S&&S.phase==='tb')tbThrow(n,m);else throwDart(n,m)}
function closePick(){const a=$('#picksheet'),b=$('#pickback');if(a)a.remove();if(b)b.remove()}
function openPick(n){closePick();
  const opts=n===25?[[1,'Outer','25'],[2,'Bullseye','50']]:[[1,'Single',n],[2,'Double','D'+n],[3,'Triple','T'+n]];
  const back=document.createElement('div');back.id='pickback';back.className='pickback';back.addEventListener('click',closePick);
  const el=document.createElement('div');el.id='picksheet';el.className='picksheet';el.setAttribute('role','dialog');el.setAttribute('aria-label','Pick where the dart landed');
  el.innerHTML=`<div class="ph"><div class="pn">${n===25?'BULL':n}</div><div class="pw">Where did it land?</div></div>
    <div class="pickrow" style="--k:${opts.length}">${opts.map(([m,l,v])=>`<button type="button" class="btn ${m===2?'d':m===3?'t':''}" data-pm="${m}">${v}<small>${l}</small></button>`).join('')}</div>
    <div style="display:flex;gap:10px"><button type="button" class="btn" data-pc="1" style="flex:1;justify-content:center;padding:12px">Cancel</button><button type="button" class="btn" data-poff="1" style="justify-content:center;padding:12px">Turn off tap assist</button></div>`;
  el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.pm){closePick();routeThrow(n,+b.dataset.pm);return}
    if(b.dataset.poff){setAssist(false);closePick();return}
    closePick()});
  document.body.appendChild(back);document.body.appendChild(el);el.querySelector('[data-pm="1"]').focus()}
document.addEventListener('click',e=>{const s=e.target.closest&&e.target.closest('#board .seg');if(!s||!assistOn())return;
  const b=$('#board');if(!b||b.classList.contains('locked'))return;
  e.stopPropagation();e.preventDefault();openPick(+s.dataset.n)},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePick()});
let wl=null;async function keepAwake(){try{const KA=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.KeepAwake;if(KA){KA.keepAwake();return}}catch(e){}try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
document.addEventListener('pointerdown',keepAwake,{once:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake()});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing||e.repeat||e.altKey||e.ctrlKey||e.metaKey)return;
  const ae=document.activeElement;
  if(ae&&(ae.tagName==='BUTTON'||ae.tagName==='SUMMARY'||ae.tagName==='A'))return; // let the focused control handle its own Enter
  // settings panel open: Enter saves
  if(ui.settings){const b=document.querySelector('[data-act="set-save"]');if(b){e.preventDefault();b.click()}return}
  // setup screen: Enter moves to the next name box, then starts the game
  if(!S){const st=$('#start');if(!st)return;e.preventDefault();
    const ins=[...document.querySelectorAll('.setup input')];const i=ins.indexOf(ae);
    if(i>=0&&i<ins.length-1){ins[i+1].focus();ins[i+1].select()}else st.click();return}
  // turn recap: Enter starts the next turn
  const nx=document.querySelector('#pending:not([hidden]) [data-act="next"]');if(nx){e.preventDefault();nx.click();return}
  // end-game confirm open: Enter keeps playing (safe default)
  const keep=document.querySelector('[data-act="keep"]');if(keep){e.preventDefault();keep.click();return}
  // tie: Enter starts the tiebreaker
  const tb=document.querySelector('#resultslot [data-act="tb-start"]');if(tb){e.preventDefault();tb.click()}
});
load();normDraft();if(S&&!S.startedAt){S.startedAt=S.roundStartedAt=Date.now();S.roundTimes=[];S.timerJoined=1;save()}if(S&&!S.penV2){S.penalty=0.5;S.penV2=1;save()}cload();bindApp();bindClassic();render();
})();
</script>
